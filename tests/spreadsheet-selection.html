<!doctype html>
<meta charset="utf-8">
<title>表格区域操作浏览器测试</title>
<link rel="stylesheet" href="../web/css/style.css">
<p id="outsideText">表格外仍然可以复制的文字</p>
<input id="qcYear" hidden><input id="qcMonth" hidden>
<div id="spreadsheetWrap">
  <table class="spreadsheet"><thead><tr><th id="sheetHeader" colspan="2">工资表员工表头</th><th>合计</th></tr></thead><tbody>
    <tr data-row-key="r1"><td><input type="number" data-row="r1" data-emp="1" value="1" oninput="workInput(this)"></td><td><input type="number" data-row="r1" data-emp="2" value="2" oninput="workInput(this)"></td><td id="readonlyCell">12345</td></tr>
    <tr data-row-key="r2"><td><input type="number" data-row="r2" data-emp="1" value="3" oninput="workInput(this)"></td><td><input type="number" data-row="r2" data-emp="2" value="4" oninput="workInput(this)"></td></tr>
  </tbody></table>
</div>
<div id="qcDeptTablesWrap">
  <table class="spreadsheet"><tbody>
    <tr data-row-key="1_0"><td><input type="number" class="qc-price-input" data-row-key="1_0" data-sub-id="10" value="1.25" oninput="priceInput(this)"></td><td><input type="number" class="qc-qty-input" data-row-key="1_0" data-key="1_0,20" value="5" oninput="qtyInput(this)"></td></tr>
    <tr data-row-key="1_1"><td><input type="number" class="qc-price-input" data-row-key="1_1" data-sub-id="10" value="2.5" oninput="priceInput(this)"></td><td><input type="number" class="qc-qty-input" data-row-key="1_1" data-key="1_1,20" value="6" oninput="qtyInput(this)"></td></tr>
  </tbody></table>
</div>
<pre id="results">未运行</pre>
<script>
  let _weRowMap = { r1: { emps: { 1: 1, 2: 2 } }, r2: { emps: { 1: 3, 2: 4 } } };
  let _qcDeptRows = { '1_0': { 10: 1.25 }, '1_1': { 10: 2.5 } };
  let _qcState = { qtyData: { '1_0,20': 5, '1_1,20': 6 } };
  let _editSession = null;
  const history = [];
  const notices = [];
  function pushHistory(type) { history.push(type); }
  function showToast(message) { notices.push(message); }
  function workInput(input) { _weRowMap[input.dataset.row].emps[input.dataset.emp] = Number(input.value || 0); }
  function priceInput(input) { _qcDeptRows[input.dataset.rowKey][input.dataset.subId] = Number(input.value || 0); }
  function qtyInput(input) { _qcState.qtyData[input.dataset.key] = Number(input.value || 0); }
</script>
<script src="../web/js/quick-calc.js"></script>
<script src="../web/js/spreadsheet-selection.js"></script>
<script>
  window.addEventListener('load', () => {
    if (new URLSearchParams(location.search).has('manual')) return;
    const errors = [];
    const check = (condition, label) => { if (!condition) errors.push(label); };
    const work = [...document.querySelectorAll('#spreadsheetWrap input')];
    const quick = [...document.querySelectorAll('#qcDeptTablesWrap input')];
    const key = (target, name, shiftKey = false, ctrlKey = false) => target.dispatchEvent(new KeyboardEvent('keydown', { key: name, shiftKey, ctrlKey, bubbles: true, cancelable: true }));
    const clipboard = (target, type, value = '') => {
      const data = { value, types: ['text/plain'], setData(_, text) { this.value = text; }, getData() { return this.value; } };
      const event = new Event(type, { bubbles: true, cancelable: true });
      Object.defineProperty(event, 'clipboardData', { value: data });
      target.dispatchEvent(event);
      return data.value;
    };

    work[0].dispatchEvent(new MouseEvent('mousedown', { button: 0, buttons: 1, bubbles: true, cancelable: true }));
    check(document.activeElement === work[0].closest('td'), '单击选中整个单元格');
    const startSelection = target => !target.dispatchEvent(new Event('selectstart', { bubbles: true, cancelable: true }));
    check(startSelection(document.getElementById('outsideText')), '拖选期间禁止表格外原生选文');
    document.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
    check(getComputedStyle(work[0]).userSelect === 'none', '真实样式禁止输入框原生选文');
    check(getComputedStyle(document.getElementById('sheetHeader')).userSelect === 'none', '真实样式禁止表头原生选文');
    check(startSelection(document.getElementById('readonlyCell')), '只读单元格禁止原生选文');
    check(!startSelection(document.getElementById('outsideText')), '表格外保持文字复制');
    check(!work[0].dispatchEvent(new Event('dragstart', { bubbles: true, cancelable: true })), '禁止浏览器拖动单元格文字');
    key(document.activeElement, 'ArrowRight');
    check(document.activeElement === work[1].closest('td'), '方向键切换单元格');
    key(document.activeElement, 'ArrowDown', true);
    check(work[1].closest('td').classList.contains('sheet-selected') && work[3].closest('td').classList.contains('sheet-selected'), 'Shift+方向键扩选');
    check(clipboard(document.activeElement, 'copy') === '2\r\n4', '区域复制 TSV');
    let keyboardCopy = '';
    const originalExecCommand = document.execCommand;
    document.execCommand = () => { keyboardCopy = document.activeElement.value; return true; };
    key(document.activeElement, 'c', false, true);
    document.execCommand = originalExecCommand;
    check(keyboardCopy === '2\n4', '数字单元格 Ctrl+C 直接复制');

    work[0].dispatchEvent(new MouseEvent('mousedown', { button: 0, buttons: 1, bubbles: true, cancelable: true }));
    work[3].dispatchEvent(new MouseEvent('mouseover', { buttons: 1, bubbles: true }));
    document.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
    check(clipboard(document.activeElement, 'copy') === '1\t2\r\n3\t4', '鼠标拖选矩形');

    clipboard(document.activeElement, 'paste', '7\t8\n9\t10');
    check(_weRowMap.r1.emps[1] === 7 && _weRowMap.r1.emps[2] === 8 && _weRowMap.r2.emps[1] === 9 && _weRowMap.r2.emps[2] === 10, '多行多列粘贴');
    check(history.length === 1 && history[0] === 'work-edit', '区域粘贴仅一条撤销记录');

    quick[0].dispatchEvent(new MouseEvent('mousedown', { button: 0, buttons: 1, bubbles: true, cancelable: true }));
    clipboard(document.activeElement, 'paste', '3.75\t12');
    check(_qcDeptRows['1_0'][10] === 3.75 && _qcState.qtyData['1_0,20'] === 12, '快捷计算单价与对数粘贴');
    check(history.length === 2 && history[1] === 'quick-calc', '跨表格历史类型');
    _editSession = { type: 'quick-calc-price', rowKey: '1_0', subId: 10, originalValue: 3.75 };
    onQcCellBlur(quick[0], 'price');
    check(history.length === 2, '小数单价失焦不产生虚假修改');

    quick[0].dispatchEvent(new MouseEvent('mousedown', { button: 0, buttons: 1, bubbles: true, cancelable: true }));
    clipboard(document.activeElement, 'paste', '4.5\t1.2');
    check(_qcDeptRows['1_0'][10] === 3.75 && _qcState.qtyData['1_0,20'] === 12 && history.length === 2, '非法对数不会部分写入');
    quick[1].dispatchEvent(new MouseEvent('mousedown', { button: 0, buttons: 1, bubbles: true, cancelable: true }));
    clipboard(document.activeElement, 'paste', '13\t14');
    check(_qcState.qtyData['1_0,20'] === 13 && notices.some(message => message.includes('超出部分')), '越界内容裁剪并提示');

    work[0].dispatchEvent(new MouseEvent('mousedown', { button: 0, buttons: 1, bubbles: true, cancelable: true }));
    work[3].dispatchEvent(new MouseEvent('mouseover', { buttons: 1, bubbles: true }));
    document.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
    clipboard(document.activeElement, 'paste', '11');
    check(Object.values(_weRowMap).every(row => Object.values(row.emps).every(value => value === 11)), '单值填满选区');
    clipboard(document.activeElement, 'paste', '');
    check(Object.values(_weRowMap).every(row => Object.values(row.emps).every(value => value === 0)), '空白单元格粘贴可清空选区');
    work[0].dispatchEvent(new MouseEvent('mousedown', { button: 0, buttons: 1, bubbles: true, cancelable: true }));
    key(document.activeElement, '6');
    check(document.activeElement === work[0] && _weRowMap.r1.emps[1] === 6, '键入数字直接覆盖并编辑');
    key(document.activeElement, 'Escape');
    check(document.activeElement === work[0].closest('td'), 'Escape 返回单元格选择');
    work[0].dispatchEvent(new MouseEvent('dblclick', { bubbles: true }));
    check(document.activeElement === work[0], '双击进入编辑');
    check(getComputedStyle(work[0]).userSelect === 'text' && !startSelection(work[0]), '主动编辑时允许选择数字');
    work[0].dispatchEvent(new MouseEvent('mousedown', { button: 0, bubbles: true, cancelable: true }));
    check(document.activeElement === work[0], '编辑时单击保持输入光标');
    document.execCommand = () => true;
    key(work[0], 'c', false, true);
    document.execCommand = originalExecCommand;
    check(work[0].classList.contains('sheet-editing'), '复制后恢复原输入框编辑状态');
    key(document.activeElement, 'ArrowRight');
    check(document.activeElement === work[1].closest('td'), '编辑时方向键移动单元格');
    key(document.activeElement, 'a', false, true);
    check(work.every(input => input.closest('td').classList.contains('sheet-selected')), 'Ctrl+A 选中当前表格');
    key(document.activeElement, 'Delete');
    check(Object.values(_weRowMap).every(row => Object.values(row.emps).every(value => value === 0)), 'Delete 清空选区');
    key(document.activeElement, 'Tab');
    check(document.activeElement === work[0].closest('td'), 'Tab 循环移动单元格');
    key(document.activeElement, 'Enter');
    check(document.activeElement === work[2].closest('td'), 'Enter 纵向移动单元格');
    key(document.activeElement, 'F2');
    check(document.activeElement === work[2], 'F2 进入编辑');
    document.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
    document.getElementById('results').textContent = errors.length ? `FAIL: ${errors.join('；')}` : 'PASS: 方向键、扩选、拖选、复制、多表粘贴、撤销记录';
  });
</script>
