name: 构建并发布 Windows Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 发布版本（例如 v4.7.0）
        required: true
        default: v4.7.0
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 检出待发布代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: 配置 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          architecture: x64
          cache: pip
      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: 核对版本
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          if ($env:REQUESTED_VERSION -notmatch '^v\d+\.\d+\.\d+$') { throw '版本号格式无效' }
          "RELEASE_VERSION=$env:REQUESTED_VERSION" >> $env:GITHUB_ENV
          if (!(Test-Path "docs/releases/$env:REQUESTED_VERSION.md")) { throw '缺少该版本发布说明' }
      - name: 安装构建依赖
        run: |
          python -m pip install -r requirements.txt pyinstaller==6.19.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 后端回归测试
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: 浏览器回归测试
        run: |
          $env:TEST_PYTHON = (Get-Command python).Source
          node tests/spreadsheet-selection-native.cjs --temps-bank
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/spreadsheet-selection-native.cjs --month-tab
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/spreadsheet-selection-native.cjs --independent-paste
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 构建 Windows EXE
        run: |
          python build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'dist/立杰工资管理系统/立杰工资管理系统.exe')) { throw '未生成 EXE' }
      - name: 打包便携版并生成校验文件
        run: python scripts/package-release.py $env:RELEASE_VERSION
      - name: 发布到 GitHub Release
        run: |
          $tag = $env:RELEASE_VERSION
          $tagCommit = git rev-list -n 1 "refs/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($tagCommit -ne $env:GITHUB_SHA) { throw '已有标签不指向当前构建提交' }
          } else {
            git tag $tag $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin $tag
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $assets = Get-ChildItem release-assets -File | ForEach-Object FullName
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --verify-tag --draft --title "立杰人力资源管理系统 $tag" --notes-file "docs/releases/$tag.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
